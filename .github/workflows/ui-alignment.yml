name: UI alignment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  headless-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated UI test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway grim dbus python3-pil
          rustup toolchain install 1.92.0 --profile minimal --component clippy
      - name: Check Rust layout contracts
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build UI fixtures
        run: |
          cargo build --locked --release --examples
          cargo build --locked --release
      - name: Check rendered alignment
        run: python3 -B tests/headless_ui.py "${{ runner.temp }}/bharta-alignment" --alignment-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bar-alignment-screenshots
          path: ${{ runner.temp }}/bharta-alignment
