[package]
name = "bharta"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A quiet, macOS-inspired native Wayland status bar for Sway"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
gtk4-layer-shell = "0.8"
libc = "0.2"
anyhow = "1"
zbus = "4.4"
ab_glyph = "0.2"
chrono = "0.4"
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "2", features = ["tls"] }
url = "2"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
tempfile = "3"
